syntax = "proto3";

package product;

service ProductService {
  // Unary RPC: lấy 1 sản phẩm theo id
  rpc GetProduct (GetProductRequest) returns (Product);

  // Server Streaming RPC: trả về danh sách sản phẩm dạng stream
  rpc ListProducts (Empty) returns (stream Product);

  // Unary phụ: kiểm tra stock (order-service sẽ gọi cái này)
  rpc CheckStock (CheckStockRequest) returns (CheckStockResponse);
}

message Empty {}

message GetProductRequest {
  string id = 1;
}

message Product {
  string id = 1;
  string name = 2;
  double price = 3;
  int32 stock = 4;
}

message CheckStockRequest {
  string product_id = 1;
  int32 quantity = 2;
}

message CheckStockResponse {
  bool available = 1;
  string message = 2;
}