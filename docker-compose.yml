services:
  postgres:
    image: postgres:16-alpine
    container_name: seminar-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: products
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: seminar-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  product-service:
    build: ./product-service
    container_name: seminar-product-service
    environment:
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    restart: on-failure

  order-service:
    build: ./order-service
    container_name: seminar-order-service
    environment:
      MONGO_URI: mongodb://mongodb:27017/orders
      PRODUCT_SERVICE_URL: product-service:50051
    depends_on:
      mongodb:
        condition: service_healthy
      product-service:
        condition: service_started
    networks:
      - app-network
    restart: on-failure

  api-gateway:
    build: ./api-gateway
    container_name: seminar-api-gateway
    ports:
      - "3000:3000"
    environment:
      PRODUCT_SERVICE_URL: product-service:50051
      ORDER_SERVICE_URL: order-service:50052
    depends_on:
      - product-service
      - order-service
    networks:
      - app-network
    restart: on-failure

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
  mongo-data: